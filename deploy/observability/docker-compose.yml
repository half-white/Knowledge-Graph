# 知识图谱服务(SSE) 全开源日志系统 — Docker Compose
# 一键启动：Loki(日志存储) + Promtail(日志采集) + Grafana(日志查询/看板/告警)
#
# 用法（在项目根目录执行）：
#   docker compose -f deploy/observability/docker-compose.yml up -d
#   docker compose -f deploy/observability/docker-compose.yml down
#
# 服务地址：
#   Grafana: http://localhost:3000   (admin / admin)
#   Loki:    http://localhost:3100
#
# 数据流：
#   SSE服务(宿主机) --JSON日志--> <项目根>/logs/sse-*.jsonl
#        --Promtail(本容器, 挂载采集)--> Loki --> Grafana
#
# 镜像版本可在环境变量中覆盖，例如：
#   LOKI_IMAGE=grafana/loki:3.5.7 docker compose ... up -d

name: sse-observability

services:
  # ---- 日志存储：Loki（单机模式，无需外部依赖） ----
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.7}
    container_name: sse-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sse-observability

  # ---- 日志采集：Promtail（采集宿主机上 SSE 服务的日志文件） ----
  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.5.7}
    container_name: sse-promtail
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # 将宿主机项目下的 logs 目录挂载进容器供采集（SSE 服务把日志写到那里）
      - ../../logs:/var/log/sse:ro
      - promtail-data:/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sse-observability

  # ---- 查询与可视化：Grafana（内置 Loki 数据源与示例看板，自动配置） ----
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.1}
    container_name: sse-grafana
    ports:
      - "3000:3000"
    depends_on:
      loki:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # 关闭匿名访问以便入门时更安全；如需无需登录即可看板，改为 true 并
      # 追加 GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - sse-observability

volumes:
  loki-data:
  promtail-data:
  grafana-data:

networks:
  sse-observability:
    driver: bridge
