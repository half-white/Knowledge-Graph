# Loki 单机模式最小配置（官方 local-config 等价实现）
# 仅用于开发/学习环境：文件系统存储 + 内存 ring，无需 Consul/etcd。
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 开发环境放开查询限制
limits_config:
  allow_structured_metadata: true
