# ============================================================
# SSE 项目配置模板（入库文件，不含任何真实配置/密钥）
#
# 用法：复制为 config/config.yml 后按需填写：
#   cp config/config.example.yml config/config.yml
# config.yml 已 gitignore（含密钥也不入库）。
#
# 每项注释里的“对应环境变量”即旧有部署变量的名称：config 包启动时
# 读取 config.yml 并回填这些变量，仅当变量“尚未设置”时写入，因此
# Docker compose 注入 / shell export 的变量始终优先。
#
# 模板中所有值都为空字符串；留空的项不会覆盖代码内置默认值
# （服务 127.0.0.1:8080、Neo4j bolt://localhost:7687、MySQL root:root@…、
# 日志 info/true/true/logs/7、RAG 0.75/5），与改造前行为一致。
# ============================================================

# 服务监听地址（SSE_ADDR；宿主机原生运行默认 127.0.0.1:8080）
# server:
#   addr: "127.0.0.1:8080"

# Neo4j 图数据库（SSE_NEO4J_URI / _USER / _PASSWORD）
# neo4j:
#   uri: "bolt://localhost:7687"
#   user: "neo4j"
#   password: "neo4j"

# MySQL / MariaDB（SSE_MYSQL_DSN）
# mysql:
#   dsn: "root:root@tcp(localhost:3306)/knowledge_graph?charset=utf8mb4&parseTime=True&loc=Local"

# 日志（SSE_LOG_LEVEL / _CONSOLE / _FILE / _DIR / _KEEP）
# log:
#   level: "info"
#   console: "true"
#   file: "true"
#   dir: "logs"
#   keep: "7"

# 大模型 / 检索密钥（GLM_API_KEY / BAIDU_CLIENT_ID / BAIDU_CLIENT_SECRET）。
# 本地调试需调用 GLM / 百度文心时在此填写真实密钥；容器内走 compose .env。
# llm:
#   glm_api_key: ""
#   baidu_client_id: ""
#   baidu_client_secret: ""

# RAG 向量检索参数（RAG_THRESHOLD / RAG_TOP_K，代码默认 0.75 / 5）
# rag:
#   threshold: "0.75"
#   top_k: "5"
