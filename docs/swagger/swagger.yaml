definitions:
  model_api.UseModelRequest:
    properties:
      title:
        type: string
    required:
    - title
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    一键生成知识图谱服务：文本/PDF 上传 → LLM 三元组抽取 → Neo4j 图谱构建。
    统一响应格式 {code, data, msg}：code=0 成功，code=7 失败，HTTP 恒为 200。
    成功响应的 data 为 ECharts 图谱 JSON 的字符串形式（前端 JSON.parse 后渲染），
    msg 为三元组抽取文本明细。接口注释规范见 README「接口文档」章节。
  title: SSE 知识图谱服务
  version: "1.0"
paths:
  /api/model:
    post:
      consumes:
      - application/json
      description: |-
        文本按语义分块并发抽取三元组（LLM），验证归一去重后写入 Neo4j，返回 ECharts 图谱数据
        data 为图谱 JSON 的字符串形式（结构 {nodes,links,categories}，前端 JSON.parse 后渲染），msg 为三元组抽取文本明细
      parameters:
      - description: 待抽取文本
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model_api.UseModelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code=0 成功；code=7 失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
                msg:
                  type: string
              type: object
      summary: 文本生成图谱
      tags:
      - 图谱生成
  /api/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        上传 PDF，经 python OCR 提取文本后走与文本生成相同的抽取管线，返回 ECharts 图谱数据
        data/msg 含义与 /api/model 相同；上传与 OCR 环节失败时 code=7 并给出中文提示
      parameters:
      - description: PDF 文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: code=0 成功；code=7 失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
                msg:
                  type: string
              type: object
      summary: PDF 上传生成图谱
      tags:
      - 图谱生成
  /healthz:
    get:
      description: 存活探针，供容器 healthcheck / CI 探测，恒返回 HTTP 200 与文本 ok
      produces:
      - text/plain
      responses:
        "200":
          description: ok
          schema:
            type: string
      summary: 健康检查
      tags:
      - 系统
swagger: "2.0"
